<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portofolio Rashya</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    
    <style>
        /* Styling Khusus Admin */
        body { padding-top: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; }
        .admin-container { width: 90%; max-width: 1000px; margin: 2rem auto; display: none; }
        .login-container { width: 100%; max-width: 400px; text-align: center; }
        
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.2); color: var(--text-primary); font-family: inherit; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-glass); }
        th { color: var(--accent-cyan); font-weight: 600; }
        
        .action-btn { padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: none; }
        .btn-edit { background: rgba(0, 210, 255, 0.2); color: var(--accent-cyan); }
        .btn-delete { background: rgba(255, 50, 50, 0.2); color: #ff4d4d; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-dark); width: 90%; max-width: 500px; padding: 2rem; border-radius: 15px; border: 1px solid var(--border-glass); }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
        .close-modal { cursor: pointer; font-size: 1.5rem; color: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- 1. FORM LOGIN -->
    <div class="login-container glass-card" id="login-section">
        <h2 style="margin-bottom: 1.5rem;">Admin <span style="color: var(--accent-cyan)">Login</span></h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" class="form-control" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••">
        </div>
        <button id="btn-login" class="btn btn-primary" style="width: 100%;">Masuk</button>
        <p id="login-error" style="color: #ff4d4d; font-size: 0.9rem; margin-top: 1rem; display: none;">Login gagal. Periksa email/password.</p>
    </div>

    <!-- 2. DASHBOARD ADMIN -->
    <div class="admin-container" id="admin-section">
        <div class="admin-header glass-card" style="padding: 1.5rem;">
            <h2>Halo, <span style="color: var(--accent-cyan)">Admin Rashya</span> 👋</h2>
            <button id="btn-logout" class="btn btn-outline" style="padding: 8px 20px;">Logout</button>
        </div>
        
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Daftar Projek</h3>
                <button class="btn btn-primary" style="padding: 8px 20px;" onclick="openModal('project')">+ Tambah Projek</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Judul Projek</th>
                            <th>Deskripsi Singkat</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-projects-table">
                        <!-- Data projek dari Supabase akan muncul di sini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 3. MODAL TAMBAH / EDIT -->
    <div class="modal" id="project-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Projek Baru</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <input type="hidden" id="project-id">
            <div class="form-group">
                <label>Judul Projek</label>
                <input type="text" id="project-title" class="form-control">
            </div>
            <div class="form-group">
                <label>Deskripsi</label>
                <textarea id="project-desc" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>URL Gambar (Link)</label>
                <input type="text" id="project-img" class="form-control" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link Projek (Opsional)</label>
                <input type="text" id="project-link" class="form-control" placeholder="https://...">
            </div>
            <button id="btn-save-project" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Simpan Projek</button>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/admin.js"></script>
</body>
</html>
